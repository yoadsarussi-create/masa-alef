:root{--bg:#2B1B5A;--ink:#1E1B3A;--cream:#FFF8E7;--pink:#FF5C8A;--teal:#2ED8C3;--sun:#FFD93D;--ok:#22C55E;--mute:#6B6480}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:#fff;font-family:Fredoka,"Noto Sans Hebrew",sans-serif;-webkit-user-select:none;user-select:none;
 padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:100%}
.top{display:flex;align-items:center;gap:8px}.top h1{font-size:1.2rem;margin:0;flex:1}
.pill{background:#ffffff1f;border:2px solid #ffffff33;border-radius:999px;padding:5px 12px;font-weight:700;white-space:nowrap}
select{font:inherit;font-size:1rem;padding:8px;border-radius:12px;border:3px solid var(--ink);width:100%}
.bar{height:10px;background:#0006;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.card{background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.95rem}
.say{font-family:"Noto Sans Hebrew",sans-serif;font-weight:700;font-size:2.1rem;line-height:1.75;text-align:center;flex:1;display:flex;align-items:center;justify-content:center;min-height:150px;padding:6px}
.hint{text-align:center;color:var(--mute);font-size:1rem;min-height:1.3em}
.st{text-align:center;font-weight:700;min-height:1.3em}
.row{display:flex;gap:10px}
button{font:inherit;font-weight:700;border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}button:disabled{opacity:.35}
.rec{background:var(--pink);color:#fff;font-size:1.6rem;padding:22px;width:100%}
.rec.on{background:#C43A66;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.7}}
.play{background:var(--teal);color:var(--ink);flex:1;padding:14px;font-size:1.2rem}
.save{background:var(--ok);color:#fff;flex:2;padding:14px;font-size:1.25rem}
.nav{background:#fff;color:var(--ink);flex:1;padding:10px;font-size:1rem}
.send{background:var(--sun);color:var(--ink);padding:14px;font-size:1.15rem;width:100%}
.tips{background:#ffffff14;border:2px solid #ffffff33;border-radius:16px;padding:10px 12px;font-size:.95rem;line-height:1.5}
.done-badge{color:var(--ok)}.need-badge{color:#C43A66;font-weight:700}.wait-badge{color:#B7791F;font-weight:700}
.only{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1rem}.only input{width:22px;height:22px}

</div>

async function startRec(){const b=$("rec");
 /* זרם-מיקרופון חדש לכל הקלטה — באייפון זרם שהוקלט פעם לא מקליט שוב */

 try{mr=new MediaRecorder(stream,mime?{mimeType:mime}:{})}catch(e){mr=new MediaRecorder(stream)}chunks=[];busy=false;

async function finish(){if(busy)return;busy=true;try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}stream=null;
