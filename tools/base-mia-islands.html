<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>האיים של Mia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Fredoka:wght@500;700&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: one-screen phone game. Home = ocean map of skill islands; play = big question card + chunky answer buttons. Single bright "sea adventure" world, light only by choice. */
:root{
  --sea:#1aa6b7; --sea-deep:#0d6e86; --sand:#ffe7b3; --sun:#ffc23d; --coral:#ff6f61;
  --leaf:#3fbf6f; --ink:#13324a; --paper:#fffaf0; --white:#ffffff; --mute:#5b7486;
  --he:"Varela Round",system-ui,sans-serif; --fun:"Fredoka","Varela Round",system-ui,sans-serif;
  --en:"Andika","Fredoka",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--he);font-size:18px;direction:rtl;
  background-image:radial-gradient(circle at 15% 10%,#ffffff22 0 60px,transparent 61px),radial-gradient(circle at 85% 30%,#ffffff18 0 90px,transparent 91px),linear-gradient(180deg,var(--sea) 0%,var(--sea-deep) 100%);
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px 40px;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer;border:0;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;gap:10px;color:var(--white)}
.top h1{font-family:var(--fun);font-size:1.5rem;margin:0;flex:1;text-shadow:0 2px 0 #0003}
.pill{background:#0003;border-radius:999px;padding:5px 12px;font-family:var(--fun);font-weight:700;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.lvl{background:var(--white);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 0 #0002}
.lvl b{font-family:var(--fun);font-size:1.1rem;white-space:nowrap}
.bar{flex:1;height:14px;background:#e6eef2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--coral));border-radius:99px;transition:width .5s}

/* turtle */
.buddy{display:flex;align-items:flex-end;gap:8px}
.buddy svg{width:76px;height:64px;flex:none}
.bubble{background:var(--white);border-radius:18px 18px 18px 4px;padding:12px 16px;font-size:1.2rem;line-height:1.45;box-shadow:0 4px 0 #0002;position:relative;flex:1}
.bounce{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}

.big{background:var(--sun);color:var(--ink);font-family:var(--fun);font-weight:700;font-size:1.45rem;border-radius:20px;padding:16px;box-shadow:0 6px 0 #c98a00;width:100%}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #c98a00}
.big small{display:block;font-family:var(--he);font-weight:400;font-size:.9rem}

/* islands map */
.map-title{color:var(--white);font-family:var(--fun);font-size:1.15rem;margin:4px 0 -4px}
.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.island{background:var(--sand);border-radius:26px 26px 22px 22px;padding:12px 10px 10px;text-align:center;box-shadow:0 5px 0 #d9b56f;position:relative;min-height:112px;display:flex;flex-direction:column;align-items:center;gap:4px}
.island:active{transform:translateY(3px);box-shadow:0 2px 0 #d9b56f}
.island .ic{font-family:var(--en);font-weight:700;font-size:1.7rem;line-height:1;color:var(--sea-deep);background:var(--white);border-radius:14px;min-width:54px;padding:6px 8px}
.island .nm{font-size:1.05rem;line-height:1.25}
.stars{font-size:1.05rem;letter-spacing:2px;color:#d6c39c}
.stars .on{color:var(--sun);text-shadow:0 1px 0 #b07a00}
.island.weak::after{content:"לחזק!";position:absolute;top:-8px;left:-6px;background:var(--coral);color:var(--white);font-size:.75rem;border-radius:99px;padding:2px 8px;box-shadow:0 2px 0 #0002}
.island.new::after{content:"חדש";position:absolute;top:-8px;left:-6px;background:var(--leaf);color:var(--white);font-size:.75rem;border-radius:99px;padding:2px 8px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.small{background:var(--white);border-radius:16px;padding:10px 6px;font-size:.92rem;box-shadow:0 4px 0 #0002;display:flex;flex-direction:column;align-items:center;gap:2px}
.small span:first-child{font-size:1.5rem}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea{font:inherit;font-size:.9rem;width:100%;box-sizing:border-box;border:2px solid #d6e6ec;border-radius:12px;padding:10px;background:var(--white);color:var(--ink);-webkit-user-select:text;user-select:text;word-break:break-all}
.fbk{min-height:1.4em;margin:0;font-weight:700}
/* view switcher */
.seg{display:grid;grid-template-columns:1fr 1fr;background:#0003;border-radius:999px;padding:4px;gap:4px}
.seg button{border-radius:999px;padding:10px 8px;color:var(--white);font-size:1.05rem;min-height:46px}
.seg button[aria-selected="true"]{background:var(--white);color:var(--ink);box-shadow:0 3px 0 #0002;font-weight:700}
/* saga map */
.saga{position:relative;display:flex;flex-direction:column;gap:6px;padding-block:10px;background:radial-gradient(ellipse at 50% 0%,#ffffff1f,transparent 60%);border-radius:28px}
.saga .path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.p-todo{fill:none;stroke:#ffffff80;stroke-width:6;stroke-dasharray:2 14;stroke-linecap:round}
.p-done{fill:none;stroke:var(--sun);stroke-width:7;stroke-dasharray:2 14;stroke-linecap:round}
.lv-row{position:relative;height:118px}
.lv-row .node{position:absolute;left:var(--x);top:8px;transform:translateX(-50%);width:78px;height:78px;border-radius:50%;background:var(--sand);box-shadow:0 6px 0 #d9b56f,0 0 0 5px #ffffff55;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
.lv-row .node:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #d9b56f}
.node .num{font-family:var(--fun);font-weight:700;font-size:1.5rem;line-height:1;color:var(--ink)}
.node .lic{font-size:.85rem;color:var(--sea-deep);font-weight:700;max-width:68px;overflow:hidden;white-space:nowrap}
.node.done{background:var(--sun);box-shadow:0 6px 0 #c98a00,0 0 0 5px #ffffff66}
.node.cur{background:var(--white);box-shadow:0 6px 0 #9fc7d4,0 0 0 6px var(--sun);animation:pulse 1.6s ease-in-out infinite}
.node.boss{width:92px;height:92px;background:var(--coral);box-shadow:0 6px 0 #c84a3f,0 0 0 5px #ffffff66}
.node.boss .num,.node.boss .lic{color:var(--white)}
.node.boss.done{background:linear-gradient(135deg,var(--sun),var(--coral))}
.node.locked{background:#9fc0c9;box-shadow:0 6px 0 #6f97a3;filter:saturate(.6)}
.node.locked .num{font-size:1.4rem}
.node .me{position:absolute;top:-46px;left:50%;transform:translateX(-50%);width:62px;animation:bob 2s ease-in-out infinite}
.node .me svg{width:62px;height:52px}
.lname{position:absolute;left:var(--x);top:94px;transform:translateX(-50%);color:var(--white);font-size:.95rem;white-space:nowrap;text-shadow:0 1px 2px #0005}
.lv-row:has(.boss) .lname{top:106px;font-weight:700}
.lstars{position:absolute;left:calc(var(--x) + 44px);top:2px;font-size:1rem;letter-spacing:0;color:#ffffff60;z-index:2}
.lstars .on{color:var(--sun);text-shadow:0 1px 0 #b07a00}
.deco{position:absolute;top:30px;font-size:2rem;opacity:.85}
@keyframes pulse{50%{box-shadow:0 6px 0 #9fc7d4,0 0 0 12px #ffc23d66}}
.lv-big{width:120px;height:120px;border-radius:50%;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-family:var(--fun);font-weight:700;color:var(--sea-deep);box-shadow:0 6px 0 #d9b56f}
.lv-big.boss{background:var(--coral);color:var(--white);box-shadow:0 6px 0 #c84a3f}
/* game */
.hud{display:flex;align-items:center;gap:8px;color:var(--white)}
.x{background:#0003;color:var(--white);width:48px;height:48px;flex:none;border-radius:50%;font-size:1.2rem}
.dots{flex:1;display:flex;gap:5px}
.dots i{flex:1;height:10px;border-radius:99px;background:#ffffff40}
.dots i.ok{background:var(--leaf)} .dots i.no{background:var(--coral)} .dots i.now{background:var(--white)}
.combo{font-family:var(--fun);font-weight:700;color:var(--sun);min-width:56px;text-align:center}
.card{background:var(--paper);border-radius:26px;padding:18px 16px 16px;box-shadow:0 6px 0 #0002;display:flex;flex-direction:column;gap:14px;min-height:300px}
.tag{align-self:flex-start;background:var(--sea);color:var(--white);border-radius:99px;padding:4px 14px;font-size:1rem}
.prompt{font-size:1.6rem;line-height:1.45;text-align:center;font-weight:700}
.prompt .w{font-family:var(--en);font-size:2.4rem;font-weight:700;display:block;margin-top:6px;direction:ltr;letter-spacing:.02em}
.prompt .w u{text-decoration:none;color:var(--coral);border-bottom:4px dashed var(--coral);padding:0 4px}
.prompt .hint{display:block;color:var(--mute);font-size:1.25rem;font-weight:400;margin-top:4px}
.prompt .letter{font-family:var(--en);font-size:5rem;font-weight:700;line-height:1;display:block;direction:ltr}
.ear{align-self:center;background:var(--sea);color:var(--white);border-radius:999px;padding:12px 22px;font-size:1.15rem;box-shadow:0 4px 0 var(--sea-deep)}
.ear:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sea-deep)}
.story{font-family:var(--en);direction:ltr;text-align:left;font-size:1.35rem;font-weight:400;margin-top:8px;line-height:1.8;background:var(--white);border:2px dashed #cfe3ea;border-radius:16px;padding:10px 14px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ans{background:var(--white);border:3px solid #d6e6ec;border-radius:18px;min-height:76px;padding:8px;font-size:1.45rem;box-shadow:0 4px 0 #d6e6ec;line-height:1.25}
.ans.en{font-family:var(--en);font-weight:700;font-size:1.8rem}
.ans:active{transform:translateY(3px);box-shadow:0 1px 0 #d6e6ec}
.ans.right{background:var(--leaf);border-color:var(--leaf);color:var(--white);box-shadow:0 4px 0 #2a8a4e}
.ans.wrong{background:var(--coral);border-color:var(--coral);color:var(--white);box-shadow:0 4px 0 #c84a3f;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{border-radius:20px;padding:14px 16px;display:flex;gap:10px;align-items:center;font-size:1.2rem;line-height:1.5}
.feedback b{font-size:1.35rem}
.pron{display:inline-block;background:var(--white);border-radius:10px;padding:2px 10px;margin-top:6px;font-size:1.15rem}
.pron .en{font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--white);border-radius:16px;padding:12px 16px;font-size:1.05rem;z-index:60;max-width:min(460px,calc(100% - 32px));box-shadow:0 6px 18px #0004;text-align:center}
/* zones question: three notebook bands as answers */
.zq{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:stretch}
.zletter{background:var(--white);border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:var(--en);font-size:4.6rem;font-weight:700;border:3px solid #d6e6ec}
.bands{display:flex;flex-direction:column;gap:6px}
.band{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 14px;min-height:64px;font-size:1.35rem;text-align:right;border:3px solid transparent;box-shadow:0 4px 0 #0001}
.band .bi{font-size:1.6rem}
.band small{display:block;font-size:.95rem;opacity:.8}
.band[data-o="גג"]{background:#dff3ff}.band[data-o="בית"]{background:#fff1cf}.band[data-o="גינה"]{background:#dcf6e4}
.band.right{background:var(--leaf)!important;color:var(--white)}.band.wrong{background:var(--coral)!important;color:var(--white);animation:shake .35s}
.placed{margin-top:8px}

.feedback.good{background:#e3f8eb}
.feedback.bad{background:#ffe9e6}
.feedback b{font-family:var(--fun);font-size:1.2rem;display:block}
.next{background:var(--leaf);color:var(--white);font-family:var(--fun);font-weight:700;font-size:1.3rem;border-radius:18px;padding:14px;box-shadow:0 5px 0 #2a8a4e}
.next:active{transform:translateY(3px);box-shadow:0 2px 0 #2a8a4e}

/* end */
.end{text-align:center;align-items:center}
.end .bigstars{font-size:3rem;letter-spacing:6px}
.end h2{font-family:var(--fun);font-size:1.8rem;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border-radius:99px;padding:6px 12px;font-size:.95rem}
.chip.g{background:#e3f8eb} .chip.r{background:#ffe9e6}
.sticker-new{font-size:4rem;animation:pop .6s}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}

/* panels */
.panel{background:var(--paper);border-radius:24px;padding:16px;box-shadow:0 6px 0 #0002;display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:var(--fun);margin:0;font-size:1.4rem}
.panel h3{margin:6px 0 0;font-size:1.1rem}
.panel p{margin:0;line-height:1.6}
.back{align-self:flex-start;background:var(--white);border-radius:99px;padding:12px 20px;min-height:48px;font-size:1.05rem;box-shadow:0 3px 0 #0002}
.lines{height:84px;position:relative;font-family:var(--en);font-size:58px;line-height:84px;direction:ltr;padding-left:8px;white-space:nowrap;overflow:hidden;
  background:linear-gradient(#9fc7d4,#9fc7d4) 0 21px/100% 1px no-repeat,linear-gradient(#4f8aa0,#4f8aa0) 0 42px/100% 1px no-repeat,linear-gradient(var(--coral),var(--coral)) 0 63px/100% 2px no-repeat,linear-gradient(#9fc7d4,#9fc7d4) 0 83px/100% 1px no-repeat;background-color:var(--white);border-radius:12px}
.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.zone{background:var(--white);border-radius:14px;padding:8px;text-align:center;font-size:.9rem}
.zone b{display:block;font-size:1.05rem}
.zone .en{display:block;font-size:1.25rem;letter-spacing:.06em;margin-top:4px}
.dgrow{background:var(--white);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.dgrow .dg{font-family:var(--en);font-weight:700;font-size:1.6rem;color:var(--coral)}
.wbtn{background:#eef8fb;border-radius:12px;padding:6px 10px;display:inline-flex;gap:6px;align-items:baseline;margin:2px}
.wbtn .en{font-size:1.15rem}
.wbtn mark{background:none;color:var(--coral);font-weight:700}
.stickers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.stk{aspect-ratio:1;max-width:100%;background:var(--white);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2rem}
.stk.locked{background:#e9eef0;color:#b9c6cc;font-size:1.2rem}
table{border-collapse:collapse;width:100%;font-size:.95rem}
td,th{padding:7px 6px;border-bottom:1px solid #e5ecef;text-align:right}
th{color:var(--mute);font-weight:400;font-size:.85rem}
.tbl{overflow-x:auto}
.lvl-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px}
input[type=text]{font:inherit;font-size:1.05rem;padding:10px;border:2px solid #d6e6ec;border-radius:12px;width:100%;box-sizing:border-box;background:var(--white);color:var(--ink);-webkit-user-select:text;user-select:text}
.form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.btn{background:var(--sea);color:var(--white);border-radius:12px;padding:10px 14px}
.btn.red{background:var(--coral)}
.btn.light{background:var(--white);color:var(--ink);border:2px solid #d6e6ec}
.muted{color:var(--mute);font-size:.9rem}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
@media (max-width:380px){.prompt .w{font-size:2rem}.island .nm{font-size:.95rem}}
.ans.wide{grid-column:1/-1;font-size:1.3rem}
.ans.pic{font-size:3rem;min-height:96px;line-height:1}
.emo{display:block;font-size:4.2rem;line-height:1.1;margin-top:6px}
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.slot{width:46px;height:56px;border-radius:12px;border:3px dashed #9fc7d4;background:var(--white);font-family:var(--en);font-size:2rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.slot.on{border-style:solid;border-color:var(--sea)}
.slots.right .slot{background:var(--leaf);border-color:var(--leaf);color:var(--white)}
.slots.wrong .slot{border-color:var(--coral);animation:shake .35s}
.slots.fix .slot{width:40px;height:48px;font-size:1.6rem;background:#e3f8eb;border-color:var(--leaf)}
.slots.fix .slot.bad{background:var(--sun)}
.tiles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.tile{width:54px;height:58px;border-radius:14px;background:var(--sun);box-shadow:0 4px 0 #c98a00;font-family:var(--en);font-size:2rem;font-weight:700}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #c98a00}
.tile:disabled{opacity:.25;box-shadow:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mt{min-height:70px;border-radius:16px;background:var(--white);border:3px solid #d6e6ec;box-shadow:0 4px 0 #d6e6ec;font-size:1.6rem;font-weight:700}
.mt.pic{font-size:2.6rem}
.mt.sel{border-color:var(--sun);background:#fff4d6}
.mt.done{background:var(--leaf);border-color:var(--leaf);color:var(--white);opacity:.55}
.wiggle{animation:shake .35s}
.row-tag{display:flex;justify-content:space-between;align-items:center;gap:8px}
.combo{font-family:var(--fun);font-weight:700;color:#c98a00;font-size:1.2rem}
.pill.pop{animation:pop .4s}
.prompt .w,.prompt .letter{margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- mastery ---------- */
function hist(sk){return S.skills[sk]||[]}
function mastery(sk){const h=hist(sk);if(h.length<3)return null;const s=h.reduce((a,b)=>a+b,0);return (s+1)/(h.length+2)}
function stars(sk){const m=mastery(sk);if(m===null)return 0;return m<.6?1:m<.85?2:3}
function weakest(){let best=null,bm=2;Object.keys(SK).forEach(k=>{const m=mastery(k);if(m!==null&&m<bm){bm=m;best=k}});return bm<.85?best:null}
function untried(){return Object.keys(SK).filter(k=>hist(k).length<3)}
function record(item,ok){S.q++;const st=S.items[item.id]||{b:0,c:0,w:0,t:0};
 if(ok){st.c++;st.b=Math.min(4,st.b+1)}else{st.w++;st.b=0}st.t=S.q;S.items[item.id]=st;
 const h=hist(item.sk).concat(ok?1:0).slice(-12);S.skills[item.sk]=h}

/* adaptive pick: weak skills + weak/unseen/old items, interleaved */
function buildRound(focus,n=10){let pool=allItems();const multi=Array.isArray(focus);if(focus)pool=pool.filter(i=>multi?focus.includes(i.sk):i.sk===focus);
 const scored=pool.map(i=>{const m=mastery(i.sk)??.45;const st=S.items[i.id];
  const itemNeed=st?(4-st.b)/4:.7;const age=st?Math.min((S.q-st.t)/40,1):.4;
  return{i,s:(1-m)*2.2+itemNeed+age*.5+Math.random()*.7}}).sort((a,b)=>b.s-a.s);
 const cnt={},pick=[];const cap=focus&&!multi?n:multi?Math.max(3,Math.ceil(n/focus.length)+1):2;
 for(const {i} of scored){if(pick.length>=n)break;if((cnt[i.sk]||0)>=cap)continue;if(i.sk==="read"&&pick.some(p=>p.sk==="read"&&p.si!==i.si))continue;cnt[i.sk]=(cnt[i.sk]||0)+1;pick.push(i)}
 if(multi&&focus.every(x=>["sh","ch","th","ph"].includes(x))){for(let i=pick.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pick[i],pick[j]]=[pick[j],pick[i]]}return pick}
 const out=[];let rest=pick.slice();while(rest.length){const prev=out[out.length-1];let k=rest.findIndex(x=>!prev||x.sk!==prev.sk);if(k<0)k=0;out.push(rest.splice(k,1)[0])}
 return out}

  return`<tr><td>${s.n}</td><td><span class="lvl-dot" style="background:${lab[0]}"></span>${lab[1]}</td><td style="font-variant-numeric:tabular-nums">${c+w?Math.round(c/(c+w)*100)+"%":"–"}</td><td style="font-variant-numeric:tabular-nums">${c+w}</td></tr>`}).join("");
 const hard=allItems().filter(i=>S.items[i.id]&&S.items[i.id].w>0).sort((a,b)=>S.items[b.id].w-S.items[a.id].w).slice(0,8)
   .map(i=>`<span class="chip r en">${i.w||i.n||i.c||i.L||(i.q&&i.q[0])}</span>`).join("");
 app.innerHTML=`<div class="panel"><button class="back" id="b">→ למפה</button><h2>פינת הורים</h2>
 <p>${S.sessions.length} הרפתקאות · ${S.q} שאלות נענו. "שולטת" מחושב לפי 12 התשובות האחרונות בכל נושא.</p>
 <div class="tbl"><table><tr><th>נושא</th><th>מצב</th><th>הצלחה</th><th>שאלות</th></tr>${rows}</table></div>
 ${hard?`<h3>מילים ופריטים שהיו קשים</h3><div class="chips" style="justify-content:flex-start">${hard}</div>`:""}
 <h3>מה שמתי לב מרשימת המילים שכתבה</h3>
 <p>האות <span class="en"><b>u</b></span> יוצאת אצלה לפעמים כמו <span class="en"><b>y</b></span> (נכתב <span class="en">bys, cyt, syn</span> במקום <span class="en">bus, cut, sun</span>). ההבדל: u נשארת בבית, y יורדת לגינה. כדאי לבקש ממנה לכתוב את שלוש המילים האלה פעם אחת. גם <span class="en">restaurant</span> נכתב בטעות.</p>
 <h3>מילים מהחוברת (עד עמ׳ 38 + 42)</h3>
 <p class="muted">הוסיפו כאן מילים מהחוברת. הן ייכנסו מיד למשחק.</p>
 <form class="form" id="addf"><input type="text" id="enw" placeholder="English" dir="ltr" aria-label="מילה באנגלית"><input type="text" id="hew" placeholder="תרגום" aria-label="תרגום לעברית"><button class="btn" type="submit">הוסף</button></form>
 <div class="chips" style="justify-content:flex-start">${S.custom.map(([e,h],i)=>`<button class="chip g" data-del="${i}"><span class="en">${e}</span> · ${h} ✕</button>`).join("")||'<span class="muted">עוד לא נוספו מילים.</span>'}</div>
 <h3>הגדרות</h3>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn light" id="snd">צלילי משחק: ${S.sound?"פועלים":"כבויים"}</button>
 <button class="btn ${confirmReset?"red":"light"}" id="rst">${confirmReset?"לחצו שוב כדי למחוק הכול":"איפוס ההתקדמות"}</button></div>
 <p class="muted">${syncNote}.</p></div>`;
 app.querySelector("#b").onclick=()=>{confirmReset=false;home()};
 app.querySelector("#addf").onsubmit=e=>{e.preventDefault();const en=app.querySelector("#enw").value.trim(),he=app.querySelector("#hew").value.trim();if(!en||!he)return;if(!S.custom.some(x=>x[0].toLowerCase()===en.toLowerCase()))S.custom.push([en,he]);save();parents()};
 app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.custom.splice(+b.dataset.del,1);save();parents()});
 app.querySelector("#snd").onclick=()=>{S.sound=!S.sound;save();parents()};
 app.querySelector("#rst").onclick=()=>{if(!confirmReset){confirmReset=true;parents();return}const keep=S.custom;S=fresh();S.custom=keep;confirmReset=false;save();parents()};
 scrollTo(0,0)}

home();importFromHash();
</script>

</body></html>
